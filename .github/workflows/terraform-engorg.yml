name: terraform-engorg

on:
  pull_request:
    paths:
      - engorg/**
      - .github/workflows/terraform-engorg.yml
  push:
    branches: [main]
    paths:
      - engorg/**
      - .github/workflows/terraform-engorg.yml
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [plan, apply]
        default: plan

permissions: {}

jobs:
  plan:
    uses: 56kcloud/acme-iacplatform-githubworkflows/.github/workflows/terraform-plan.yml@b13da41c3b7db5029012ef2ac18987585715283c # v0.0.1
    permissions:
      contents: read
      id-token: write
    with:
      working-directory: engorg
      aws-role-arn: ${{ vars.AWS_ROLE_ARN_ENGORG }}
      app-id: ${{ vars.SHARED_WORKFLOWS_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.SHARED_WORKFLOWS_APP_PRIVATE_KEY }}

  apply:
    needs: plan
    # No ref check: an apply dispatched from a branch must fail in "Require main", not skip.
    if: github.event_name == 'push' || inputs.action == 'apply'
    uses: 56kcloud/acme-iacplatform-githubworkflows/.github/workflows/terraform-deploy.yml@b13da41c3b7db5029012ef2ac18987585715283c # v0.0.1
    permissions:
      contents: read
      id-token: write
    with:
      working-directory: engorg
      plan-artifact: ${{ needs.plan.outputs.plan-artifact }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN_ENGORG }}
      app-id: ${{ vars.SHARED_WORKFLOWS_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.SHARED_WORKFLOWS_APP_PRIVATE_KEY }}
