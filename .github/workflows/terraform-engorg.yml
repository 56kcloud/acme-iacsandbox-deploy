name: terraform-engorg

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - engorg/**
      - .github/workflows/terraform-engorg.yml
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [plan, apply]
        default: plan

permissions: {}

jobs:
  plan-engorg:
    uses: 56kcloud/acme-iacplatform-githubworkflows/.github/workflows/terraform-plan.yml@0babc1d18868533aa00e01544170d8ddded41fa5 # v0.0.4
    permissions:
      contents: read
      id-token: write
    with:
      working-directory: engorg
      aws-role-arn: ${{ vars.AWS_ROLE_ARN_ENGORG }}
      client-id: ${{ vars.SHARED_WORKFLOWS_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.SHARED_WORKFLOWS_APP_PRIVATE_KEY }}

  apply-engorg:
    needs: plan-engorg
    # No ref check: an apply dispatched from a branch must fail in "Require main", not skip.
    if: github.event_name == 'push' || inputs.action == 'apply'
    uses: 56kcloud/acme-iacplatform-githubworkflows/.github/workflows/terraform-deploy.yml@0babc1d18868533aa00e01544170d8ddded41fa5 # v0.0.4
    permissions:
      contents: read
      id-token: write
    with:
      working-directory: engorg
      plan-artifact: ${{ needs.plan-engorg.outputs.plan-artifact }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN_ENGORG }}
      client-id: ${{ vars.SHARED_WORKFLOWS_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.SHARED_WORKFLOWS_APP_PRIVATE_KEY }}
